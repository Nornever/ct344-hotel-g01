<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Booking | StayEasy</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
    fieldset {
        margin: 14px 0 0;
        padding: 8px 16px 14px;
        border: 1px solid var(--line);
        border-radius: 7px;
    }

    legend {
        padding: 0 6px;
        font-weight: bold;
    }

    label.inline {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 8px 28px 0 0;
        font-weight: normal;
        cursor: pointer;
    }

    label.inline input[type="radio"] {
        width: auto;
        margin: 0;
    }

    label small {
        display: block;
        margin-top: 6px;
        font-weight: normal;
        color: #52606d;
    }
</style>
</head>

<body>
    <header><a class="brand" href="index.html">StayEasy Hotel</a>
        <nav><a href="rooms.html">Rooms</a><a href="booking.html">Book</a><a href="register.html">Customer
                registration</a></nav>
    </header>
    <main class="container narrow">
        <h1>Booking: improve this form</h1>
        <p>All fields below begin as text fields. Replace controls step by step using the workshop instructions.</p>

        <form id="booking-form">
            <label>Check-in date<input id="check-in" type="date" required></label>
            <label>Check-out date<input id="check-out" type="date" required></label>
            <!-- Step 5 design decision. Why does this reduce user effort or confusion? A guest can see the room capacity rule (up to 4 guests, 3 to 4 for the family room) before choosing a room type, so they avoid picking a room that is too small and having to go back and redo the form. -->
            <label>Guest count<input id="guests" type="number" min="1" max="4" value="1" required>
                <small>Up to 4 guests per room. Standard and Deluxe rooms suit 1 to 2 guests and the Family room suits 3 to 4 guests.</small></label>
            <label>Room type
                <select id="room-type" required>
                    <option value="">Choose room type</option>
                    <option value="standard">Standard room</option>
                    <option value="deluxe">Deluxe room</option>
                    <option value="family">Family room</option>
                </select>
            </label>
            <label>Room number<select id="room-number" required disabled>
                    <option value="">Choose room type first</option>
                </select></label>
            <fieldset>
                <legend>Payment method</legend>
                <label class="inline"><input type="radio" name="payment" value="Card" checked>Card</label>
                <label class="inline"><input type="radio" name="payment" value="Bank transfer">Bank transfer</label>
            </fieldset>
            <label>Special request<textarea id="request" placeholder="Optional request"></textarea></label>
            <button type="submit">Review booking</button>
            <p id="status" class="status" role="status">Choose dates, room type, and room number.</p>
        </form>

        <section id="preview" class="preview" hidden></section>

        <script src="js/rooms.js"></script>
        <script src="js/booking.js"></script>
    </main>

    <!-- Usability test task: A guest travelling with two children wants to book a family room for three nights next month and pay by bank transfer. -->
    <!-- Expected evidence: I will watch for hesitation at the guest count field, whether the tester notices the capacity hint, whether they pick the right room type without help, and whether they notice that the room number list stays disabled until a room type is chosen. -->
</body>

</html>
